<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NEXUS DEFENSE — массив башен</title>
<style>
  :root{
    --bg:#05070c;
    --ink:#cfe6ff;
    --dim:#5d7590;
    --line:rgba(120,190,255,.16);
    --panel:rgba(8,14,22,.82);
    --accent:#35e0ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
  body{
    font-family:ui-monospace,"SF Mono",Consolas,"Roboto Mono","JetBrains Mono",monospace;
    color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;cursor:default;
  }
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  #hud > *{pointer-events:auto}
  .vig{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse 120% 90% at 50% 45%,transparent 35%,rgba(0,0,0,.55) 100%),
      linear-gradient(180deg,rgba(5,8,14,.55) 0%,transparent 18%,transparent 78%,rgba(5,8,14,.7) 100%);}

  header{position:absolute;top:20px;left:22px}
  header h1{margin:0;font-size:15px;letter-spacing:.42em;font-weight:600;color:#eaf6ff;
    text-shadow:0 0 18px rgba(53,224,255,.45)}
  header .sub{margin-top:7px;font-size:10.5px;letter-spacing:.24em;color:var(--dim)}
  header .bar{width:210px;height:2px;margin-top:11px;
    background:linear-gradient(90deg,var(--accent),rgba(53,224,255,0));opacity:.75}

  #panel{position:absolute;top:20px;right:20px;width:322px;background:var(--panel);
    border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%);
    opacity:0;transform:translateX(14px);transition:opacity .3s,transform .3s;
    max-height:calc(100% - 110px);overflow:auto;scrollbar-width:thin}
  #panel.on{opacity:1;transform:none}
  #panel::-webkit-scrollbar{width:5px}
  #panel::-webkit-scrollbar-thumb{background:rgba(120,190,255,.25)}
  .p-top{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
  .p-idx{font-size:10px;letter-spacing:.3em;color:var(--dim)}
  .p-name{margin-top:5px;font-size:17px;letter-spacing:.12em;font-weight:600;color:#fff}
  .p-ru{margin-top:3px;font-size:11.5px;color:var(--dim)}
  .p-role{display:inline-block;margin-top:10px;padding:3px 9px;font-size:9.5px;letter-spacing:.2em;
    border:1px solid currentColor;border-radius:1px;text-transform:uppercase;opacity:.95}
  .p-body{padding:13px 16px 16px}
  .p-desc{font-size:11.5px;line-height:1.72;color:#a9c6de}
  .stats{margin-top:15px;display:grid;gap:9px}
  .st{display:grid;grid-template-columns:78px 1fr 44px;align-items:center;gap:9px}
  .st .k{font-size:9px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
  .st .t{height:4px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
  .st .t i{position:absolute;inset:0 auto 0 0;width:0;transition:width .5s cubic-bezier(.2,.9,.2,1)}
  .st .v{font-size:10.5px;text-align:right;color:#dceaf7}
  .p-note{margin-top:15px;padding:9px 11px;font-size:10.5px;line-height:1.65;
    border-left:2px solid currentColor;background:rgba(255,255,255,.035);color:#bfd8ec}

  #dock{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:8px;
    align-items:center;flex-wrap:wrap;justify-content:center;max-width:min(900px,calc(100% - 40px))}
  .btn{font:inherit;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);
    background:rgba(10,18,28,.72);border:1px solid var(--line);padding:8px 13px;cursor:pointer;
    transition:.18s;backdrop-filter:blur(10px)}
  .btn:hover{background:rgba(53,224,255,.12);border-color:rgba(53,224,255,.55);color:#fff}
  .btn.act{background:rgba(53,224,255,.18);border-color:rgba(53,224,255,.7);color:#fff;
    box-shadow:inset 0 0 18px rgba(53,224,255,.18)}
  .hint{position:absolute;left:22px;bottom:22px;font-size:9.5px;letter-spacing:.13em;
    color:var(--dim);line-height:1.9}
  .hint b{color:#a7c8e2;font-weight:600}

  .tag{position:absolute;transform:translate(-50%,-100%);padding:4px 9px;font-size:10px;
    letter-spacing:.16em;white-space:nowrap;background:rgba(6,11,18,.8);border:1px solid currentColor;
    opacity:0;transition:opacity .2s;pointer-events:none}
  .tag.on{opacity:1}
  .tag u{text-decoration:none;color:#fff;margin-left:8px}

  #load{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--bg);transition:opacity .6s}
  #load.off{opacity:0;pointer-events:none}
  #load div{font-size:11px;letter-spacing:.4em;color:var(--dim);text-align:center}
  #load .ln{width:180px;height:1px;margin:14px auto 0;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sweep 1.1s ease-in-out infinite}
  @keyframes sweep{0%,100%{opacity:.2;transform:scaleX(.3)}50%{opacity:1;transform:scaleX(1)}}

  #fail{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:var(--bg);
    text-align:center;font-size:12px;line-height:2;color:#ff8f8f;padding:30px}
  @media (max-width:900px){
    #panel{width:270px;top:auto;bottom:78px;right:12px;max-height:52%}
    .hint{display:none}
  }
</style>
</head>
<body>

<div id="fail"><div>WebGL недоступен в этом браузере.<br>Включи аппаратное ускорение и перезагрузи страницу.</div></div>
<div id="load"><div>ИНИЦИАЛИЗАЦИЯ МАССИВА<div class="ln"></div></div></div>

<div class="vig"></div>

<div id="hud">
  <header>
    <h1>Nexus Defense</h1>
    <div class="sub">Массив башен · 10 прототипов · техно-футуризм</div>
    <div class="bar"></div>
  </header>

  <aside id="panel">
    <div class="p-top">
      <div class="p-idx">— // —</div>
      <div class="p-name">—</div>
      <div class="p-ru">—</div>
      <div class="p-role">—</div>
    </div>
    <div class="p-body">
      <div class="p-desc"></div>
      <div class="stats"></div>
      <div class="p-note"></div>
    </div>
  </aside>

  <div class="hint">
    <b>ЛКМ</b> — выбрать башню &nbsp;·&nbsp; <b>1…0</b> — быстрый выбор<br>
    <b>← →</b> — навигация &nbsp;·&nbsp; <b>пробел</b> — тестовая стрельба &nbsp;·&nbsp; <b>esc</b> — общий план
  </div>

  <div id="dock"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ===================== утилиты ===================== */
const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const hex = n => '#' + n.toString(16).padStart(6, '0');
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

const ACCS = [0x35e0ff, 0xff9d2e, 0x7ad7ff, 0x8cff5a, 0xc46bff, 0xff5edb, 0xffe14d, 0xff5a3c, 0x4d7cff, 0x00ffa3];

/* тёмные базовые цвета при высоком metalness дают чёрные силуэты —
   поднимаем albedo к читаемой стали, сохраняя оттенок */
/* мягкая круглая точка — без неё Points рисует серые квадраты */
const dotTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(.35, 'rgba(255,255,255,.75)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const dotMat = (color, size, opacity) => new THREE.PointsMaterial({
  color, size, map: dotTex, transparent: true, opacity,
  blending: THREE.AdditiveBlending, depthWrite: false
});

const metal = (color = 0x2b333f, m = 0.68, r = 0.42) => {
  const c = new THREE.Color(color).lerp(new THREE.Color(0x8d99a8), .3);
  return new THREE.MeshStandardMaterial({ color: c, metalness: Math.min(m, .58), roughness: r });
};

const neon = (color, i = 2.6) => new THREE.MeshStandardMaterial({
  color: 0x080c12, emissive: new THREE.Color(color), emissiveIntensity: i * .42,
  metalness: 0.25, roughness: 0.45
});

const glassMat = color => new THREE.MeshPhysicalMaterial({
  color, metalness: 0, roughness: 0.06, transmission: 0.92, thickness: 0.7,
  ior: 1.9, clearcoat: 1, clearcoatRoughness: 0.05, transparent: true
});

const addShadow = root => root.traverse(o => {
  if (o.isMesh && !o.userData.noShadow) { o.castShadow = true; o.receiveShadow = true; }
});

function idPlate(text, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const x = c.getContext('2d');
  x.font = 'bold 82px ui-monospace, Consolas, monospace';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = hex(color); x.globalAlpha = .9;
  x.fillText(text, 128, 66);
  x.globalCompositeOperation = 'destination-out'; x.globalAlpha = 1;
  for (let y = 0; y < 128; y += 3) { x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, y, 256, 1.5); }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.5, .75), new THREE.MeshBasicMaterial({
    map: t, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  m.rotation.x = -Math.PI / 2; m.userData.noShadow = true; m.renderOrder = 3;
  return m;
}

/* базовая платформа: гекс-плита, светящийся кант, пилоны, ID-табличка */
function hexBase(accent, index) {
  const g = new THREE.Group();
  const body = metal(0x222a35, .9, .42);
  const dark = metal(0x141a22, .85, .55);

  const plate = new THREE.Mesh(new THREE.CylinderGeometry(2.15, 2.42, 0.34, 6), body);
  plate.position.y = .17; g.add(plate);

  const inset = new THREE.Mesh(new THREE.CylinderGeometry(1.78, 1.86, 0.1, 6), dark);
  inset.position.y = .39; g.add(inset);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(2.16, 0.045, 6, 6), neon(accent, 3.4));
  rim.rotation.x = Math.PI / 2; rim.rotation.z = Math.PI / 6; rim.position.y = .345; g.add(rim);

  const glow = new THREE.Mesh(new THREE.CircleGeometry(1.78, 6), new THREE.MeshBasicMaterial({
    color: accent, transparent: true, opacity: .1, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  glow.rotation.x = -Math.PI / 2; glow.position.y = .4; glow.userData.noShadow = true; g.add(glow);

  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 + Math.PI / 6;
    const p = new THREE.Mesh(new THREE.BoxGeometry(.26, .3, .26), body);
    p.position.set(Math.cos(a) * 1.95, .42, Math.sin(a) * 1.95);
    p.rotation.y = -a; g.add(p);
    const led = new THREE.Mesh(new THREE.BoxGeometry(.2, .035, .06), neon(accent, 2.2));
    led.position.set(Math.cos(a) * 2.06, .56, Math.sin(a) * 2.06);
    led.rotation.y = -a; led.userData.noShadow = true; g.add(led);
  }
  const pl = idPlate(index, accent);
  pl.position.set(0, .405, 1.15);
  g.add(pl);
  return g;
}

/* ===================== рендерер и сцена ===================== */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('fail').style.display = 'grid';
  document.getElementById('load').classList.add('off');
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070c);
scene.fog = new THREE.FogExp2(0x05070c, 0.021);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 26, 34);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.minDistance = 4;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 3, 0);
controls.autoRotateSpeed = 0.42;

/* процедурное окружение для отражений — тёмное, с цветными панелями */
function buildEnvironment() {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(
    new THREE.SphereGeometry(12, 24, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      vertexShader: 'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
      fragmentShader: `varying vec3 vP; void main(){
        float h = normalize(vP).y*.5+.5;
        gl_FragColor = vec4(mix(vec3(0.04,0.055,0.08), vec3(0.16,0.28,0.44), pow(h,1.4)),1.);
      }`
    })
  ));
  const panel = (col, pos, w, h) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col }));
    m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m);
  };
  panel(0x2f7fb8, [-8, 5, 0], 8, 5);
  panel(0xa02878, [8, 4, 0], 8, 5);
  panel(0x1d6b7a, [0, 9, 0], 9, 9);
  panel(0x4a5a30, [0, -6, 6], 12, 6);
  const pm = new THREE.PMREMGenerator(renderer);
  const rt = pm.fromScene(s, 0.03);
  pm.dispose();
  return rt.texture;
}
scene.environment = buildEnvironment();

scene.add(new THREE.HemisphereLight(0x6fa8d8, 0x141c28, 0.8));
const key = new THREE.DirectionalLight(0xcfe8ff, 1.9);
key.position.set(14, 26, 12);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 4; key.shadow.camera.far = 90;
key.shadow.camera.left = -30; key.shadow.camera.right = 30;
key.shadow.camera.top = 26; key.shadow.camera.bottom = -22;
key.shadow.bias = -0.0007;
scene.add(key);
const fillA = new THREE.PointLight(0x35e0ff, 30, 60, 2); fillA.position.set(-18, 6, 12); scene.add(fillA);
const fillB = new THREE.PointLight(0xff4fd8, 22, 60, 2); fillB.position.set(18, 7, -10); scene.add(fillB);

/* пол + техносетка */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), metal(0x070a10, 0.72, 0.4));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
scene.add(floor);

function gridPlane(size, cell, color, opacity) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uCell: { value: cell }, uFade: { value: 46 }, uOp: { value: opacity }
    },
    vertexShader: `varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz;
      gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `varying vec3 vW; uniform vec3 uColor; uniform float uCell; uniform float uFade; uniform float uOp;
      void main(){
        vec2 p = vW.xz/uCell;
        vec2 g = abs(fract(p-.5)-.5)/max(fwidth(p),vec2(1e-4));
        float l = 1.-min(min(g.x,g.y),1.);
        float d = 1.-smoothstep(0.,uFade,length(vW.xz));
        float a = l*d*uOp;
        if(a<0.002) discard;
        gl_FragColor = vec4(uColor, a);
      }`
  }));
  m.rotation.x = -Math.PI / 2; m.position.y = .012; m.renderOrder = 1; m.userData.noShadow = true;
  return m;
}
scene.add(gridPlane(120, 1, 0x2f7fb8, .22), gridPlane(120, 5, 0x35e0ff, .42));

/* пыль в воздухе */
const dustN = 900, dustPos = new Float32Array(dustN * 3);
for (let i = 0; i < dustN; i++) {
  dustPos[i * 3] = rnd(-46, 46); dustPos[i * 3 + 1] = rnd(.2, 18); dustPos[i * 3 + 2] = rnd(-32, 32);
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, dotMat(0x6fb6e0, .3, .5));
scene.add(dust);

/* ===================== эффекты ===================== */
const liveFx = [];

function beam(color, rCore = .05, rHalo = .16) {
  const g = new THREE.Group();
  const mk = (r, op) => {
    const geo = new THREE.CylinderGeometry(r, r, 1, 8, 1, true);
    geo.translate(0, .5, 0);
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: op, blending: THREE.AdditiveBlending,
      depthWrite: false, side: THREE.DoubleSide
    }));
    m.userData.noShadow = true; m.renderOrder = 4;
    return m;
  };
  const core = mk(rCore, 1), halo = mk(rHalo, .34);
  g.add(core, halo);
  g.userData = { core, halo };
  g.visible = false;
  scene.add(g);
  return g;
}
function alignBeam(b, from, to) {
  b.position.copy(from);
  const d = new THREE.Vector3().subVectors(to, from);
  const len = d.length();
  b.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
  b.scale.set(1, len, 1);
}
function fireBeam(b, from, to, dur = .18, grow = 5) {
  alignBeam(b, from, to);
  b.visible = true;
  liveFx.push({
    t: 0, dur, grow, step(p) {
      const w = p < .12 ? p / .12 : 1 - (p - .12) / .88 * .55;
      b.userData.core.material.opacity = w;
      b.userData.halo.material.opacity = w * .34;
      const s = 1 + p * grow;
      b.userData.halo.scale.set(s, 1, s);
    },
    done() { b.visible = false; b.userData.halo.scale.set(1, 1, 1); }
  });
}

function cone(color) {
  const geo = new THREE.ConeGeometry(1, 1, 20, 1, true);
  geo.translate(0, -.5, 0);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide
  }));
  m.userData.noShadow = true; m.renderOrder = 4; m.visible = false;
  scene.add(m);
  return m;
}
function fireCone(c, from, to, radius, dur = .5) {
  c.position.copy(from);
  const d = new THREE.Vector3().subVectors(to, from);
  const len = d.length();
  c.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
  c.visible = true;
  liveFx.push({
    t: 0, dur, step(p) {
      c.material.opacity = Math.sin(p * Math.PI) * .5 * (.75 + Math.random() * .45);
      const s = .35 + p * .8;
      c.scale.set(radius * s, len, radius * s);
    },
    done() { c.visible = false; }
  });
}

function arc(count, color) {
  const g = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false
  });
  for (let i = 0; i < count; i++) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(14 * 3), 3));
    const l = new THREE.Line(geo, mat);
    l.userData.noShadow = true; l.renderOrder = 5;
    g.add(l);
  }
  scene.add(g);
  return {
    zap(a, b, life = .16) {
      g.children.forEach(l => {
        const p = l.geometry.attributes.position.array;
        for (let i = 0; i < p.length; i += 3) {
          const t = i / 3 / 14;
          p[i] = lerp(a.x, b.x, t) + (i ? rnd(-.16, .16) : 0);
          p[i + 1] = lerp(a.y, b.y, t) + rnd(-.2, .2);
          p[i + 2] = lerp(a.z, b.z, t) + (i ? rnd(-.16, .16) : 0);
        }
        l.geometry.attributes.position.needsUpdate = true;
      });
      g.visible = true;
      liveFx.push({
        t: 0, dur: life, step(p) { mat.opacity = p < .25 ? 1 : 1 - (p - .25) / .75; },
        done() { g.visible = false; }
      });
    }
  };
}

function burst(color, from, n = 26, spread = 1.6) {
  const pos = new Float32Array(n * 3), vel = [];
  for (let i = 0; i < n; i++) {
    pos.set([from.x, from.y, from.z], i * 3);
    vel.push(V(rnd(-1, 1), rnd(-.2, 1.4), rnd(-1, 1)).normalize().multiplyScalar(rnd(.8, 3) * spread));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(geo, dotMat(color, .22, 1));
  p.position.copy(from);
  scene.add(p);
  liveFx.push({
    t: 0, dur: .7, step(t) {
      const a = geo.attributes.position.array;
      for (let i = 0; i < n; i++) {
        vel[i].y -= 7 * t * .016;
        a[i * 3] += vel[i].x * .016; a[i * 3 + 1] += vel[i].y * .016; a[i * 3 + 2] += vel[i].z * .016;
      }
      geo.attributes.position.needsUpdate = true;
      p.material.opacity = 1 - t;
      p.material.size = .22 * (1 - t * .6);
    },
    done() { scene.remove(p); geo.dispose(); p.material.dispose(); }
  });
}

    note: 'Чистый контроль. Создаёт бутылочное горлышко — там бьют Pulse Cannon и Melter.' },
  { name: 'NANITE FORGE', ru: 'Нанитная кузня', role: 'Поддержка',
    desc: 'Рой нанитов обслуживает соседние башни: чинит их и добавляет 25% к скорострельности в радиусе 8. Сама не стреляет.',
    stats: { 'Урон': [0, '—'], 'Цели': [0, '—'], 'Скор.': [.8, '+25%'], 'Дальн.': [.42, '8'], 'Стоим.': [.6, '160'] },
    note: 'Аура складывается, но не умножается. Три кузни рядом = ×1.75 ко всей группе.' }
];

/* ===================== расстановка ===================== */
const TOWERS = [];
const SPACING = 8.2, ROWS = [-4.6, 4.6];
META.forEach((meta, i) => {
  const built = BUILDERS[i]();
  const col = i % 5, row = Math.floor(i / 5);
  built.root.position.set((col - 2) * SPACING, 0, ROWS[row]);
  built.root.rotation.y = (col - 2) * .05 + row * .12;
  built.root.userData.towerIndex = i;
  addShadow(built.root);
  scene.add(built.root);
  TOWERS.push({
    i, meta, ...built,
    posV: new THREE.Vector3(built.root.position.x, built.h * .5 + .3, built.root.position.z)
  });
});

/* подписи */
const hud = document.getElementById('hud');
TOWERS.forEach(t => {
  const el = document.createElement('div');
  el.className = 'tag';
  el.style.color = hex(ACCS[t.i]);
  el.innerHTML = `<span>${String(t.i + 1).padStart(2, '0')} · ${t.meta.name}</span><u>${t.meta.ru}</u>`;
  hud.appendChild(el);
  t.tag = el;
});

/* ===================== постобработка ===================== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.38, 0.7, 0.7);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ===================== UI ===================== */
const panel = document.getElementById('panel');
const dock = document.getElementById('dock');
let selected = -1, hovered = -1, userPicked = false;
['pointerdown', 'keydown', 'wheel'].forEach(ev =>
  addEventListener(ev, () => userPicked = true, { once: true, passive: true }));

TOWERS.forEach(t => {
  const b = document.createElement('button');
  b.className = 'btn';
  b.textContent = String(t.i + 1).padStart(2, '0') + ' ' + t.meta.name;
  b.addEventListener('click', () => select(t.i));
  b.addEventListener('mouseenter', () => hovered = t.i);
  b.addEventListener('mouseleave', () => hovered = -1);
  dock.appendChild(b);
  t.btn = b;
});

const mkBtn = (label, on, cb) => {
  const b = document.createElement('button');
  b.className = 'btn' + (on ? ' act' : '');
  b.textContent = label;
  b.addEventListener('click', cb);
  dock.appendChild(b);
  return b;
};
let autoSpin = true, wire = false;
const btnAll = mkBtn('Общий план', false, () => overview());
const btnSpin = mkBtn('Автоповорот', true, () => { autoSpin = !autoSpin; btnSpin.classList.toggle('act', autoSpin); });
const btnWire = mkBtn('Каркас', false, () => {
  wire = !wire; btnWire.classList.toggle('act', wire);
  scene.traverse(o => {
    if (o.isMesh && o.material && o.material.isMeshStandardMaterial) o.material.wireframe = wire;
  });
});
const btnFire = mkBtn('Залп', false, () => { if (selected >= 0) TOWERS[selected].fire(TOWERS[selected].root); });

/* панель */
function renderPanel(t) {
  const m = t.meta, a = hex(ACCS[t.i]);
  panel.querySelector('.p-idx').textContent = `БАШНЯ ${String(t.i + 1).padStart(2, '0')} / 10`;
  panel.querySelector('.p-name').textContent = m.name;
  panel.querySelector('.p-ru').textContent = m.ru;
  const role = panel.querySelector('.p-role');
  role.textContent = m.role; role.style.color = a;
  panel.querySelector('.p-desc').textContent = m.desc;
  const st = panel.querySelector('.stats');
  st.innerHTML = '';
  for (const [k, [v, label]] of Object.entries(m.stats)) {
    const row = document.createElement('div');
    row.className = 'st';
    row.innerHTML = `<div class="k">${k}</div><div class="t"><i></i></div><div class="v">${label}</div>`;
    st.appendChild(row);
    const bar = row.querySelector('i');
    requestAnimationFrame(() => { bar.style.background = a; bar.style.width = (v * 100) + '%'; });
  }
  const note = panel.querySelector('.p-note');
  note.textContent = m.note; note.style.color = a;
  panel.classList.add('on');
}

/* камера */
let flight = null;
function flyTo(pos, target) {
  flight = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, k: 0 };
  controls.enabled = false;
}
function select(i) {
  selected = i;
  TOWERS.forEach(t => t.btn.classList.toggle('act', t.i === i));
  const t = TOWERS[i];
  const dir = V(.62, .42, 1).normalize();
  flyTo(t.posV.clone().addScaledVector(dir, 6.4 + t.h * 2.0), t.posV.clone());
  renderPanel(t);
}
function overview() {
  selected = -1;
  panel.classList.remove('on');
  TOWERS.forEach(t => t.btn.classList.remove('act'));
  flyTo(V(0, 26, 34), V(0, 3, 0));
}

/* пикинг */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downX = 0, downY = 0;
function pick(ev) {
  ptr.x = (ev.clientX / innerWidth) * 2 - 1;
  ptr.y = -(ev.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(TOWERS.map(t => t.root), true);
  if (!hits.length) return -1;
  let o = hits[0].object;
  while (o && o.userData.towerIndex === undefined) o = o.parent;
  return o ? o.userData.towerIndex : -1;
}
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) return;
  const i = pick(e);
  if (i >= 0) select(i); else overview();
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.buttons) return;
  hovered = pick(e);
  renderer.domElement.style.cursor = hovered >= 0 ? 'pointer' : 'default';
});

addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') {
    const n = e.key === '0' ? 9 : (+e.key - 1);
    select(n);
  } else if (e.key === 'Escape') overview();
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') select((selected + 1 + 10) % 10);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') select((selected + 9) % 10);
  else if (e.key === ' ') {
    e.preventDefault();
    if (selected >= 0) TOWERS[selected].fire(TOWERS[selected].root);
  }
});

/* ===================== цикл ===================== */
const clock = new THREE.Clock();
let tAcc = 0;

function frame() {
  const dt = Math.min(clock.getDelta(), .05);
  tAcc += dt;

  if (flight) {
    flight.k = Math.min(1, flight.k + dt * 1.9);
    const e = ease(flight.k);
    camera.position.lerpVectors(flight.p0, flight.p1, e);
    controls.target.lerpVectors(flight.t0, flight.t1, e);
    if (flight.k >= 1) { flight = null; controls.enabled = true; }
  }
  controls.autoRotate = autoSpin && !flight && selected < 0;
  controls.update();

  TOWERS.forEach(t => {
    const near = selected < 0 || selected === t.i || hovered === t.i;
    const s = selected === t.i ? 1 : (near ? 1 : .94);
    t.root.scale.lerp(V(s, s, s), .12);
    const mul = selected === t.i ? 2.1 : 1;
    t.spin.forEach(sp => sp.o.rotation[sp.ax] += sp.s * dt * mul);
    t.bob.forEach(b => {
      b.o.userData.baseY ??= b.o.position.y;
      b.o.position.y = b.o.userData.baseY + Math.sin(tAcc * b.s + b.ph) * b.amp;
    });
    t.pulse.forEach((p, k) => {
      if (p.isLight) {
        p.userData.base ??= p.intensity;
        p.intensity = p.userData.base * (.82 + Math.sin(tAcc * 3 + k) * .18);
      } else if (p.material?.emissive) {
        p.userData.baseE ??= p.material.emissiveIntensity;
        p.material.emissiveIntensity = p.userData.baseE * (.75 + Math.sin(tAcc * 3.4 + k * 1.7) * .35);
      }
    });
    t.extra?.forEach(f => f(tAcc));
    t.tick?.(t.root, dt, tAcc);
  });

  for (let i = liveFx.length - 1; i >= 0; i--) {
    const f = liveFx[i];
    f.t += dt;
    f.step(Math.min(1, f.t / f.dur), dt);
    if (f.t >= f.dur) { f.done(); liveFx.splice(i, 1); }
  }

  const dp = dust.geometry.attributes.position.array;
  for (let i = 0; i < dustN; i++) {
    dp[i * 3 + 1] += dt * .12;
    if (dp[i * 3 + 1] > 18) dp[i * 3 + 1] = 0;
  }
  dust.geometry.attributes.position.needsUpdate = true;

  const v = new THREE.Vector3();
  TOWERS.forEach(t => {
    const show = selected === t.i || hovered === t.i;
    t.tag.classList.toggle('on', show);
    if (!show) return;
    v.copy(t.posV); v.y = t.h + 1.1; v.project(camera);
    t.tag.style.left = ((v.x * .5 + .5) * innerWidth) + 'px';
    t.tag.style.top = ((-.5 * v.y + .5) * innerHeight) + 'px';
  });

  composer.render();
  requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

/* автопоказ: до первого клика крутимся по башням, потом стрельба выбранной */
setInterval(() => { if (selected >= 0 && !document.hidden) TOWERS[selected].fire(TOWERS[selected].root); }, 2600);
let tourT = 3, tourIdx = 0;
setInterval(() => {
  if (userPicked || document.hidden) return;
  if (selected >= 0) {
    if (--tourT <= 0) { overview(); tourT = 3; }
  } else if (--tourT <= 0) {
    select(tourIdx++ % 10); tourT = 4;
  }
}, 1000);

overview();
requestAnimationFrame(() => {
  document.getElementById('load').classList.add('off');
  setTimeout(() => document.getElementById('load')?.remove(), 700);
  frame();
});
</script>
</body>
</html>
